[package]
name = "ticket-scanner"
version = "0.1.0"
edition = "2024"
description = "QR code meal ticket scanner for Raspberry Pi"

[[bin]]
name = "ticket-scanner"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
